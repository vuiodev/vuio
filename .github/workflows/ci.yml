name: Release

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      task_to_run:
        description: 'Which part of the workflow to run'
        type: choice
        options:
          - test
          - release
          - docker
          - test-freebsd-aarch64
          - release-freebsd-aarch64
        required: true
        default: 'test'
      tag_name:
        description: 'Required for "release", "release-freebsd-aarch64", or "docker" task: The tag for the action (e.g., v1.0.1)'
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: vuio
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rustfmt
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -p vuio-core -p vuio-cli -p vuio-cast -p vuio-web -- --check

  # ===================================================================
  # The web interface ships compiled into the binary.
  #
  # Its source is a separate repository (vuiodev/vuio-web), so this one
  # carries only the built bundle, committed at crates/vuio-web/dist. That
  # is what lets `cargo build` and the Docker builder work with no Node,
  # and what lets the interface be developed without this checkout.
  #
  # The trade is that nothing here can prove the bundle matches its source
  # — that check belongs to vuio-web's own CI. What this job can do is
  # refuse a bundle that is malformed or has lost its provenance, either
  # of which would otherwise surface as a blank page at runtime.
  # ===================================================================
  web_ui:
    name: Web UI bundle is intact
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: The bundle is present and complete
        run: |
          dist=crates/vuio-web/dist
          test -f "$dist/index.html" || { echo "::error::$dist/index.html is missing"; exit 1; }

          # Every script and stylesheet the shell asks for has to be in the
          # bundle. A partial commit passes `cargo build` and then serves a
          # page that silently fails to boot in the browser.
          missing=0
          for asset in $(grep -o '/_app/immutable/[A-Za-z0-9./_-]*\.\(js\|css\)' "$dist/index.html" | sort -u); do
            if [ ! -f "$dist$asset" ]; then
              echo "::error::$dist/index.html references $asset, which is not committed"
              missing=1
            fi
          done
          exit $missing
      - name: The bundle records where it came from
        run: |
          info=crates/vuio-web/BUILD_INFO.toml
          if [ ! -f "$info" ]; then
            echo "::error::$info is missing — rebuild with ./scripts/build-web.sh"
            exit 1
          fi
          cat "$info"
          if grep -q 'commit = "unknown"' "$info"; then
            echo "::error::the bundle cannot be traced to a vuio-web commit"
            exit 1
          fi

  clippy:
    name: Clippy
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo registry, git dependencies and compiler artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            clippy-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Run Clippy
        env:
          RUSTC_WRAPPER: sccache
        run: cargo clippy -p vuio-core -p vuio-cli -p vuio-cast -p vuio-web --all-targets --all-features -- -D clippy::all -D warnings
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

  # ===================================================================
  # Guard the published API of vuio-core.
  #
  # The crate is embedded in device firmware that is updated rarely, so a
  # break reaches those installations slowly or never. Review alone does not
  # catch an accidental `pub`, hence two mechanical gates: a committed
  # snapshot that must be regenerated deliberately, and semver-checks against
  # the last release once one exists.
  # ===================================================================
  api_surface:
    name: Public API surface
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned: the listing format is the snapshot's format, so an unplanned
      # tool upgrade would read as an API change.
      PUBLIC_API_VERSION: 0.52.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      # cargo-public-api reads rustdoc JSON, which is nightly-only. The
      # toolchain installed last is the default, so stable comes second.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-public-api
        id: cache-public-api
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-public-api
          key: cargo-public-api-${{ env.PUBLIC_API_VERSION }}
      - name: Install cargo-public-api
        if: steps.cache-public-api.outputs.cache-hit != 'true'
        run: cargo install cargo-public-api --locked --version ${{ env.PUBLIC_API_VERSION }}
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Compare the public API against the committed snapshot
        run: |
          cargo public-api -p vuio-core --simplified \
            --omit auto-trait-impls,blanket-impls > /tmp/api-surface.txt
          if ! diff -u crates/vuio-core/api-surface.txt /tmp/api-surface.txt; then
            echo "::error::The public API of vuio-core changed."
            echo "If the change is intended, regenerate the snapshot with:"
            echo "  cargo public-api -p vuio-core --simplified --omit auto-trait-impls,blanket-impls > crates/vuio-core/api-surface.txt"
            echo "and say in the commit message why the promise is being changed."
            exit 1
          fi
      - name: Check semver against the last published release
        run: |
          # vuio-core is not on crates.io until the 0.1 release; there is
          # nothing to compare against until then, and that is not a failure.
          published=$(curl -sS -H "User-Agent: vuio-ci" \
            -o /dev/null -w '%{http_code}' \
            https://crates.io/api/v1/crates/vuio-core)
          if [ "$published" = "200" ]; then
            cargo semver-checks check-release -p vuio-core
          else
            echo "vuio-core is not published yet (HTTP $published); no baseline to compare."
          fi

  # ===================================================================
  # Every feature must build alone and with none of them enabled.
  #
  # Features that are only ever tested together drift into depending on each
  # other, which is exactly what happened before they were introduced: the
  # cast helpers lived inside the MCP module, so `casting` could not be built
  # without `mcp`. This job is what keeps that from coming back.
  # ===================================================================
  feature_matrix:
    name: Feature combinations
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: features-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            features-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            features-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build with no features
        env:
          RUSTC_WRAPPER: sccache
        run: cargo check -p vuio-core --no-default-features
      - name: Build each feature alone
        env:
          RUSTC_WRAPPER: sccache
        run: |
          for feature in casting dashboard diagnostics mcp mediainfo metadata web-ui \
                         demux transcode transcode-ac3 transcode-dts transcode-aac; do
            echo "::group::$feature"
            cargo check -p vuio-core --no-default-features --features "$feature"
            echo "::endgroup::"
          done
      # The transcode features are on by default, which makes their *absence*
      # the path that rots unnoticed. Everything else here proves a feature
      # builds; this proves the server still builds and behaves without one.
      - name: Build with the decoders dropped
        run: |
          cargo check -p vuio-core --no-default-features \
            --features casting,dashboard,diagnostics,mcp,mediainfo,metadata,web-ui
          cargo test -p vuio-core --lib --no-default-features \
            --features casting,dashboard,diagnostics,mcp,mediainfo,metadata,web-ui,unstable-internals
      - name: Build with everything
        run: cargo check -p vuio-core --all-features

  # ===================================================================
  # Verify the crate still builds on its declared minimum Rust version.
  # `rust-version` is a promise to integrators pinning an old toolchain,
  # and raising it is a minor release, never a patch.
  # ===================================================================
  msrv:
    name: Minimum supported Rust version
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Read rust-version from the manifest
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' crates/vuio-core/Cargo.toml | cut -d'"' -f2)
          echo "Declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the declared toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: msrv-${{ steps.msrv.outputs.version }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            msrv-${{ steps.msrv.outputs.version }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            msrv-${{ steps.msrv.outputs.version }}-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      # No --locked: Cargo.lock is deliberately gitignored in this repo, so a
      # fresh checkout has none and --locked would fail before compiling.
      - name: Check the crate with default features
        env:
          RUSTC_WRAPPER: sccache
        run: cargo check -p vuio-core

  # ===================================================================
  # Run Tests and Checks (Push, Pull Requests, or Manual 'test' run)
  # ===================================================================
  test_and_check:
    name: Test/build on ${{ matrix.target }}
    # This job runs for branch pushes, pull requests, or when manually triggered with 'test'.
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            mode: native-test
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            mode: windows-socket-test
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            mode: native-test
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            mode: cross-linux
          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            mode: cross-linux
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            mode: build-only
          - runner: macos-14
            target: aarch64-apple-darwin
            mode: native-test
          - runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            mode: freebsd-vm

    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 8G

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Rust toolchain (stable)
        if: matrix.mode != 'freebsd-vm'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo registry, git dependencies and compiler artifacts
        if: matrix.mode != 'freebsd-vm'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: test-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            test-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            test-${{ runner.os }}-${{ matrix.target }}-
            test-${{ runner.os }}-
      - name: Install sccache
        if: matrix.mode != 'freebsd-vm'
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install dependencies for ARM cross-compile (Linux)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf')
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross
          fi
      - name: Configure cross-linker (Linux ARM)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf')
        run: |
          mkdir -p ~/.cargo "$HOME/bin"
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            # Ubuntu's armhf cross GCC rejects -mno-omit-leaf-frame-pointer from cc-rs/ring.
            cat > "$HOME/bin/arm-linux-gnueabihf-gcc-wrap" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" != "-mno-omit-leaf-frame-pointer" ]]; then
              args+=("$arg")
            fi
          done
          exec arm-linux-gnueabihf-gcc "${args[@]}"
          EOF
            chmod +x "$HOME/bin/arm-linux-gnueabihf-gcc-wrap"
            echo '[target.armv7-unknown-linux-gnueabihf]' >> ~/.cargo/config.toml
            echo "linker = \"$HOME/bin/arm-linux-gnueabihf-gcc-wrap\"" >> ~/.cargo/config.toml
            echo "CC_armv7_unknown_linux_gnueabihf=$HOME/bin/arm-linux-gnueabihf-gcc-wrap" >> "$GITHUB_ENV"
          fi
      - name: Run native tests
        if: matrix.mode == 'native-test'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo test --target ${{ matrix.target }}
      - name: Test reusable SSDP binding on Windows
        if: matrix.mode == 'windows-socket-test'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo test -p vuio-core reusable_ssdp_sockets_can_bind_in_either_startup_order --lib --target ${{ matrix.target }}
      - name: Fast PR compile check for non-native target
        if: matrix.mode != 'native-test' && matrix.mode != 'freebsd-vm' && github.event_name == 'pull_request'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo check --target ${{ matrix.target }}
      - name: Full build for non-native target
        if: matrix.mode != 'native-test' && matrix.mode != 'freebsd-vm' && github.event_name != 'pull_request'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --target ${{ matrix.target }}
      - name: Build and test in FreeBSD VM
        if: matrix.mode == 'freebsd-vm'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          usesh: true
          sync: rsync
          copyback: false
          mem: "6144"
          cache-after-prepare: true
          prepare: |
            pkg install -y curl bash git cmake
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            rustc -vV
            cargo build
            # Skip audio_integration_tests: audiotags ID3 write SIGSEGV under QEMU.
            # Skip samsungtv_browse / mcp / metrics: AppState harness SIGSEGV under
            # FreeBSD QEMU (sysinfo kinfo_getfile / getmntinfo).
            cargo test --lib
            cargo test --test issue_24_pagination
            cargo test --test path_normalization_integration_tests
            cargo test --test regression_tests
      - name: Show sccache stats
        if: always() && matrix.mode != 'freebsd-vm'
        run: sccache --show-stats || true


  # ===================================================================
  # Manual FreeBSD aarch64 test (QEMU is too slow for push/PR matrix)
  # ===================================================================
  test_freebsd_aarch64:
    name: Test on aarch64-unknown-freebsd (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test-freebsd-aarch64'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Build and test in FreeBSD aarch64 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          arch: aarch64
          usesh: true
          sync: rsync
          copyback: false
          mem: "6144"
          cache-after-prepare: true
          prepare: |
            pkg install -y curl bash git rust cmake
          run: |
            set -e
            rustc -vV
            cargo build
            # Skip audio_integration_tests: audiotags ID3 write SIGSEGV under QEMU.
            # Skip samsungtv_browse / mcp / metrics: AppState harness SIGSEGV under
            # FreeBSD QEMU (sysinfo kinfo_getfile / getmntinfo).
            # issue_24_pagination: ignored on aarch64 (SIGSEGV under QEMU).
            cargo test --lib
            cargo test --test issue_24_pagination
            cargo test --test path_normalization_integration_tests
            cargo test --test regression_tests


  # ===================================================================
  # Job 2: Build Release Artifacts (No longer depends on tests)
  # ===================================================================
  build_release_artifacts:
    name: Build release for ${{ matrix.target }}
    # This job runs for tag pushes or when manually triggered with 'release'
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    # This job no longer depends on test_and_check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os-arch: linux-x86_64
            asset_ext: .tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os-arch: windows-x86_64
            asset_ext: .exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os-arch: macos-x86_64
            asset_ext: .tar.gz
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os-arch: linux-arm64
            asset_ext: .tar.gz
          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            os-arch: linux-armv7
            asset_ext: .tar.gz
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            os-arch: windows-arm64
            asset_ext: .exe
          - runner: macos-14
            target: aarch64-apple-darwin
            os-arch: macos-arm64
            asset_ext: .tar.gz
          - runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            os-arch: freebsd-x86_64
            asset_ext: .tar.gz
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        if: matrix.target != 'x86_64-unknown-freebsd'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo registry, git dependencies and compiler artifacts
        if: matrix.target != 'x86_64-unknown-freebsd'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            release-${{ runner.os }}-${{ matrix.target }}-
            release-${{ runner.os }}-
      - name: Install sccache
        if: matrix.target != 'x86_64-unknown-freebsd'
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install NSIS (Windows)
        if: false # runner.os == 'Windows' - Disabled by user request
        run: choco install nsis
      - name: Install dependencies for ARM cross-compile (Linux)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf')
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross
          fi
      - name: Configure cross-linker (Linux ARM)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf')
        run: |
          mkdir -p ~/.cargo "$HOME/bin"
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            # Ubuntu's armhf cross GCC rejects -mno-omit-leaf-frame-pointer from cc-rs/ring.
            cat > "$HOME/bin/arm-linux-gnueabihf-gcc-wrap" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" != "-mno-omit-leaf-frame-pointer" ]]; then
              args+=("$arg")
            fi
          done
          exec arm-linux-gnueabihf-gcc "${args[@]}"
          EOF
            chmod +x "$HOME/bin/arm-linux-gnueabihf-gcc-wrap"
            echo '[target.armv7-unknown-linux-gnueabihf]' >> ~/.cargo/config.toml
            echo "linker = \"$HOME/bin/arm-linux-gnueabihf-gcc-wrap\"" >> ~/.cargo/config.toml
            echo "CC_armv7_unknown_linux_gnueabihf=$HOME/bin/arm-linux-gnueabihf-gcc-wrap" >> "$GITHUB_ENV"
          fi
      - name: Build binary
        if: matrix.target != 'x86_64-unknown-freebsd'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release --target ${{ matrix.target }} --bin ${{ env.BINARY_NAME }}
      - name: Build binary in FreeBSD VM
        if: matrix.target == 'x86_64-unknown-freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          usesh: true
          sync: rsync
          copyback: true
          mem: "6144"
          cache-after-prepare: true
          prepare: |
            pkg install -y curl bash git cmake
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            rustc -vV
            cargo build --release
      - name: Package artifacts
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.tag_name }}" ]; then
              echo "Error: The 'tag_name' input is required when running the 'release' task."
              exit 1
            fi
            VERSION_TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION_TAG="${{ github.ref_name }}"
          fi
          VERSION=${VERSION_TAG#v}
          echo "Building artifacts for version: $VERSION_TAG"
          if [ "${{ matrix.target }}" == "x86_64-unknown-freebsd" ]; then
            BINARY_PATH_PREFIX="target/release"
          else
            BINARY_PATH_PREFIX="target/${{ matrix.target }}/release"
          fi
          ASSET_NAME="${{ env.BINARY_NAME }}-${{ matrix.os-arch }}${{ matrix.asset_ext }}"
          if [ "${{ runner.os }}" == "Windows" ]; then
            BINARY_FILE="${{ env.BINARY_NAME }}.exe"
            # Just copy the binary directly instead of building installer
            cp "$BINARY_PATH_PREFIX/$BINARY_FILE" "./$ASSET_NAME"
            # makensis -V2 -DVERSION=$VERSION -DAPP_EXE=$BINARY_FILE -DOUTFILE=$ASSET_NAME installer.nsi
          else
            tar -czf "$ASSET_NAME" -C "$BINARY_PATH_PREFIX" "${{ env.BINARY_NAME }}"
          fi
      - name: Upload artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-${{ matrix.os-arch }}
          path: ${{ env.BINARY_NAME }}-*

  # ===================================================================
  # Manual FreeBSD aarch64 release build (too slow for automatic matrix)
  # ===================================================================
  release_freebsd_aarch64:
    name: Build release for aarch64-unknown-freebsd (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release-freebsd-aarch64'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Require tag_name
        run: |
          if [ -z "${{ github.event.inputs.tag_name }}" ]; then
            echo "Error: The 'tag_name' input is required when running the 'release-freebsd-aarch64' task."
            exit 1
          fi
      - name: Build release binary in FreeBSD aarch64 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          arch: aarch64
          usesh: true
          sync: rsync
          copyback: true
          mem: "6144"
          cache-after-prepare: true
          prepare: |
            pkg install -y curl bash git rust cmake
          run: |
            set -e
            rustc -vV
            cargo build --release
      - name: Package artifact
        shell: bash
        run: |
          VERSION_TAG="${{ github.event.inputs.tag_name }}"
          echo "Building FreeBSD aarch64 artifact for version: $VERSION_TAG"
          ASSET_NAME="${{ env.BINARY_NAME }}-freebsd-arm64.tar.gz"
          tar -czf "$ASSET_NAME" -C target/release "${{ env.BINARY_NAME }}"
          ls -la "$ASSET_NAME"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-freebsd-arm64
          path: ${{ env.BINARY_NAME }}-freebsd-arm64.tar.gz
      - name: Upload asset to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_TAG="${{ github.event.inputs.tag_name }}"
          ASSET_NAME="${{ env.BINARY_NAME }}-freebsd-arm64.tar.gz"
          gh release upload "$VERSION_TAG" "$ASSET_NAME" --clobber

  # ===================================================================
  # Job 3: Create GitHub Release
  # ===================================================================
  create_github_release:
    name: Create GitHub Release
    # This job runs for tag pushes or when manually triggered with 'release'
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: ubuntu-latest
    needs: build_release_artifacts
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          draft: true
          files: release-artifacts/*/*
          
  # ===================================================================
  # Job 4: Build and Push Docker Image
  # ===================================================================
  build_and_push_docker:
    name: Build and Push Docker Image
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'docker')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:v0.12.5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.tag_name }}" ]; then
              echo "Error: The 'tag_name' input is required when running the '${{ github.event.inputs.task_to_run }}' task manually."
              exit 1
            fi
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.BINARY_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.get_version.outputs.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.get_version.outputs.TAG }}
            type=semver,pattern={{major}},value=${{ steps.get_version.outputs.TAG }}
            type=raw,value=latest,enable=${{ startsWith(steps.get_version.outputs.TAG, 'v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=buildx-chef
            type=gha,scope=buildx-deps-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
            type=gha,scope=buildx-build
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.BINARY_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=buildx-chef
            type=gha,mode=max,scope=buildx-deps-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
            type=gha,mode=max,scope=buildx-build
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.BINARY_NAME }}:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          provenance: false

  publish_helm_chart:
    name: Publish Helm Chart
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Package and Push Helm Chart
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.tag_name }}" ]; then
              echo "Error: The 'tag_name' input is required when running the 'release' task."
              exit 1
            fi
            VERSION_TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION_TAG="${{ github.ref_name }}"
          fi
          
          # Strip leading 'v' if present
          VERSION=${VERSION_TAG#v}
          echo "Packaging Helm chart with version: $VERSION"
          
          # Convert owner to lowercase for GHCR compatibility
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          helm package helm/vuio --version "$VERSION" --app-version "$VERSION"
          helm push vuio-"$VERSION".tgz oci://ghcr.io/"$OWNER"/charts

  update_homebrew_formula:
    name: Update Homebrew Formula
    needs: [build_release_artifacts, create_github_release]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Get tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Checkout Homebrew Tap Repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/homebrew-vuio
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
          path: homebrew-vuio

      - name: Calculate Checksums and Update Formula
        run: |
          TAG_NAME="${{ steps.get_tag.outputs.TAG }}"
          VERSION=${TAG_NAME#v}
          
          echo "Calculating checksums for release $TAG_NAME..."
          
          # Helper function to find downloaded artifact and get SHA256
          get_sha256() {
            local asset_name=$1
            local file_path
            file_path=$(find release-artifacts -name "$asset_name" -type f | head -n 1)
            if [ -z "$file_path" ] || [ ! -f "$file_path" ]; then
              echo "Error: Release asset $asset_name not found in downloaded artifacts!" >&2
              exit 1
            fi
            local sha
            sha=$(sha256sum "$file_path" | cut -d' ' -f1)
            if [ ${#sha} -ne 64 ] || [[ ! "$sha" =~ ^[0-9a-f]{64}$ ]] || [ "$sha" = "0019dfc4b32d63c1392aa264aed2253c1e0c2fb09216f8e2cc269bbfb8bb49b5" ]; then
              echo "Error: Invalid sha256 ($sha) for $asset_name!" >&2
              exit 1
            fi
            echo "$sha"
          }
          
          MAC_ARM_SHA=$(get_sha256 "vuio-macos-arm64.tar.gz")
          MAC_INTEL_SHA=$(get_sha256 "vuio-macos-x86_64.tar.gz")
          LINUX_ARM64_SHA=$(get_sha256 "vuio-linux-arm64.tar.gz")
          LINUX_ARMV7_SHA=$(get_sha256 "vuio-linux-armv7.tar.gz")
          LINUX_INTEL_SHA=$(get_sha256 "vuio-linux-x86_64.tar.gz")
          
          echo "MAC_ARM_SHA: $MAC_ARM_SHA"
          echo "MAC_INTEL_SHA: $MAC_INTEL_SHA"
          echo "LINUX_ARM64_SHA: $LINUX_ARM64_SHA"
          echo "LINUX_ARMV7_SHA: $LINUX_ARMV7_SHA"
          echo "LINUX_INTEL_SHA: $LINUX_INTEL_SHA"
          
          echo "Updating Formula/vuio.rb..."
          FORMULA_FILE="homebrew-vuio/Formula/vuio.rb"
          
          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA_FILE"
          
          # Update URLs to new version
          sed -i "s|releases/download/v.*/|releases/download/${TAG_NAME}/|g" "$FORMULA_FILE"
          
          # Use python to safely update the checksum strings in Formula/vuio.rb
          python3 -c "
          import re, sys
          
          mac_arm = '$MAC_ARM_SHA'
          mac_intel = '$MAC_INTEL_SHA'
          linux_arm64 = '$LINUX_ARM64_SHA'
          linux_armv7 = '$LINUX_ARMV7_SHA'
          linux_intel = '$LINUX_INTEL_SHA'
          
          with open('$FORMULA_FILE', 'r') as f:
              content = f.read()
              
          patterns = [
              (r'(vuio-macos-arm64\.tar\.gz\"\s+sha256\s+\")[^\"]+(\")', mac_arm),
              (r'(vuio-macos-x86_64\.tar\.gz\"\s+sha256\s+\")[^\"]+(\")', mac_intel),
              (r'(vuio-linux-arm64\.tar\.gz\"\s+sha256\s+\")[^\"]+(\")', linux_arm64),
              (r'(vuio-linux-armv7\.tar\.gz\"\s+sha256\s+\")[^\"]+(\")', linux_armv7),
              (r'(vuio-linux-x86_64\.tar\.gz\"\s+sha256\s+\")[^\"]+(\")', linux_intel),
          ]
          
          for pattern, sha in patterns:
              new_content, count = re.subn(pattern, r'\g<1>' + sha + r'\g<2>', content)
              if count != 1:
                  print(f'Error: Expected 1 match for pattern {pattern}, found {count}', file=sys.stderr)
                  sys.exit(1)
              content = new_content
          
          with open('$FORMULA_FILE', 'w') as f:
              f.write(content)
          "
          
          cd homebrew-vuio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vuio.rb
          git commit -m "Update vuio formula to version ${VERSION}"
          git push origin main
