[package]
name = "vuio-core"
version = "0.0.44"
edition = "2021"
rust-version = "1.95"
authors = ["vyrti"]
description = "Embeddable VuIO DLNA/UPNP, Chromecast, and Airplay media server runtime"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vuiodev/vuio"
homepage = "https://github.com/vuiodev/vuio"
documentation = "https://docs.rs/vuio-core"
readme = "README.md"
keywords = ["dlna", "upnp", "ssdp", "chromecast", "airplay"]
categories = ["multimedia", "network-programming"]

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "vuio_core"
path = "src/lib.rs"

[features]
# The full server is the product: everything is on by default, and an
# integrator who adds vuio-core gets a complete media server. The flags below
# exist so a constrained deployment — a vehicle, a router, a fixed-image
# appliance — can drop what it will never use, and so a vendor auditing what
# ships in their firmware has less to read.
#
# Never gated, because they are what a media server *is*: SSDP discovery, UPnP
# ContentDirectory, HTTP range streaming, media scanning and indexing, the
# database, and configuration.
default = [
    "casting",
    "dashboard",
    "diagnostics",
    "mcp",
    "metadata",
    "mediainfo",
    "web-ui",
]

# Cast to Chromecast, AirPlay and DLNA renderers.
#
# `symphonia/opt-simd` lives here rather than on `metadata` because all it does
# is swap symphonia's own FFT for rustfft's SIMD one, and the FFT is only
# reached by the transform-based decoders. Casting is the only thing that
# decodes audio: remux demuxes without decoding, and reading tags never decodes
# at all. Scoping it this way keeps the rustfft tree out of a metadata-only
# build while still giving SSE/AVX and NEON to the AirPlay path, where
# real-time decode on a small box is tight.
casting = [
    "dep:vuio-cast",
    "dep:symphonia",
    "symphonia/opt-simd",
    "dep:hap-crypto",
    "dep:hap-transport",
    "dep:hap-tlv8",
    "dep:hkdf",
    "dep:sha2",
    "dep:num-bigint",
    "dep:plist",
    "dep:hex",
    "dep:getrandom",
]
dashboard = []
diagnostics = ["dep:sysinfo"]
mcp = []
metadata = ["dep:symphonia"]

# The Svelte browser interface, served on its own listener (port 8090 by
# default) beside the built-in dashboard on the main port. Both surfaces are
# the same router over the same state, so this adds a second front end rather
# than a second server: no proxy, no extra database handle, no duplicated API.
#
# It implies `dashboard` because that is the gate `/api/media`,
# `/api/server-info` and `/api/admin/config` are registered behind, and the app
# calls all three. Drop it for a build that should expose only DLNA and the
# original dashboard.
web-ui = ["dep:vuio-web", "dashboard"]

# Fetch titles, synopses, ratings and artwork for the library from public metadata
# APIs. This is the one part of VuIO that leaves the LAN, and it is the reason
# `reqwest` is in the tree at all: `http_client.rs` is deliberately cleartext with
# no TLS, no redirects and no name resolution, which is right for talking to a TV
# on the same subnet and useless for talking to musicbrainz.org.
#
# On by default because the dashboard section has to be visible for anyone to find
# the feature, and nothing here opens a socket until the operator presses the
# button. Drop it for a build that must never reach the internet.
mediainfo = ["dep:reqwest"]
unstable-internals = []

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "fs", "time", "sync", "macros", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.24", features = ["v4"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
futures-util = "0.3"
async-stream = "0.3"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
notify = "8.2"
notify-debouncer-full = "0.7"
toml = "1.1"
toml_edit = "0.25"
serde_json = "1.0"
dirs = "6.0"
hostname = "0.4"
ipnet = "2.12"
http = "1.5"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
bytes = "1.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
quick-xml = "0.41"
percent-encoding = "2.3"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"], optional = true }
socket2 = { version = "0.6", features = ["all"] }
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }
vuio-cast = { path = "../vuio-cast", version = "0.0.4", default-features = false, optional = true }
vuio-web = { path = "../vuio-web", version = "0.0.44", optional = true }
jwalk = "0.9"
tokio-stream = "0.1"
hap-crypto = { version = "1.4", optional = true }
hap-transport = { version = "1.3", optional = true }
hap-tlv8 = { version = "1.0", optional = true }
hkdf = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
num-bigint = { version = "0.5", optional = true }
# `all` is `all-codecs` + `all-formats` + `all-meta`: every container symphonia
# can demux and every tag dialect it can read, including APEv1/APEv2. Listed
# rather than inherited from upstream's `default` so what ships stays auditable
# and cannot drift when that default changes. SIMD is added by `casting` above.
symphonia = { version = "0.6", default-features = false, features = ["all"], optional = true }
getrandom = { version = "0.4", optional = true }
plist = { version = "1.10", optional = true }
hex = { version = "0.4", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled", "collation"] }
# Only the `mediainfo` feature uses this, and only to talk to public metadata APIs
# over TLS. `rustls-no-provider` rather than a provider-selecting feature because
# `Runtime::start` already installs the ring provider process-wide, and a second
# installation from a dependency's default would be the one that loses.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock"
] }

[dev-dependencies]
vuio-core = { path = ".", features = ["unstable-internals"] }
# Symphonia reads tags but cannot write them, and the audio tests build their
# fixtures by tagging generated files. Test-only, so it ships with nothing.
audiotags = "0.5"
tempfile = "3.27"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
