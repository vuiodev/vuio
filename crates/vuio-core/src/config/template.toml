# VuIO Server Configuration
# Platform: PLACEHOLDER_PLATFORM
# Auto-generated configuration with platform-specific defaults

# Server configuration
# Recommended ports for this platform: PLACEHOLDER_PREFERRED_PORTS
[server]
port = 8080
interface = "0.0.0.0"
name = "VuIO Server"
uuid = "00000000-0000-0000-0000-000000000000"
ip = ""

# Network configuration
# SSDP is used for DLNA device discovery
[network]
interface_selection = "Auto"
multicast_ttl = 4
announce_interval_seconds = 30
# Optional CIDRs allowed as UPnP event callback destinations in addition to the subscribing peer.
upnp_callback_allowed_networks = []

# Modern browser interface
# A second HTTP listener serving the Svelte web interface. It carries the same
# API and the same media streams as the main port — one server, two front ends —
# so it is subject to the same [management] auth as the built-in dashboard.
[web_ui]
enabled = true
port = 8090

[management]
# Requires a token for the dashboard and every management endpoint.
# --auth and VUIO_AUTH=1 turn this on too; any of the three is enough.
enabled = false
# Omit to use admin.token beside this config file. VUIO_ADMIN_TOKEN overrides the file.
session_ttl_hours = 12
# Empty permits management only from loopback. Add explicit CIDRs for LAN administration.
allowed_networks = []

# Model Context Protocol server, at POST /mcp on the main port.
# Lets an AI agent browse, search, build playlists and cast to your devices.
[mcp]
enabled = true
# Hide every mutating and casting tool, leaving only the browsing half.
read_only = false
# Demand a bearer token for /mcp even when [management].enabled is false.
require_auth = false

# Media configuration
# Default media directories for this platform: PLACEHOLDER_DEFAULT_MEDIA_DIRECTORIES
[media]
scan_on_startup = true
watch_for_changes = true
cleanup_deleted_files = true
autoplay_enabled = true
supported_extensions = [
    "mp4", "mkv", "avi", "mov", "wmv", "flv", "webm", "m4v", "3gp",
    "mp3", "flac", "wav", "aac", "ogg", "wma",
    # Elementary Dolby and DTS streams, decoded for renderers that cannot play them.
    "ac3", "eac3", "ec3", "dts",
    "jpg", "jpeg", "png", "gif", "bmp", "webp", "heif", "heic", "avif"
]

# Monitored media directories
# Platform-specific exclude patterns: PLACEHOLDER_DEFAULT_EXCLUDE_PATTERNS
[[media.directories]]
path = "PLACEHOLDER_DEFAULT_MEDIA_PATH"
recursive = true
# case_sensitive = true # Optional override; omit to auto-detect this root/volume
validation_mode = "Warn"

# Database configuration
# Platform default database location: PLACEHOLDER_DEFAULT_DATABASE_PATH
[database]
path = "PLACEHOLDER_DATABASE_PATH"
# Reclaim free space in the index file at startup and shutdown. Rewrites the
# whole file, so it adds time to both on a large library.
vacuum_on_startup = false
backup_enabled = false

# Online media info
# The only part of VuIO that contacts anything outside the local network, and
# only when asked to from the dashboard.
[mediainfo]
enabled = false

# Audio for TVs that cannot decode AC-3, Dolby Digital Plus or DTS.
# Those codecs are licensed, and a set sold without the licence plays the
# picture and nothing else. When this is on, such a film is offered twice — the
# original and an already-decoded version — and the TV plays whichever it can.
# A TV that was already fine is unaffected.
[transcode]
enabled = true
# What the decoded version is delivered as.
#   ac3   Dolby Digital, which is what a television was built to decode. The
#         only one that keeps a film's surround: a DTS 5.1 soundtrack arrives
#         as AC-3 5.1 at 640 kbps rather than folded down to a stereo pair
#   aac   about a third of that, lossy, stereo, and cannot be scrubbed
#   lpcm  uncompressed, seekable, about 1.5 Mbps. Audio files only — a film's
#         soundtrack shares a transport stream with the picture, where PCM
#         does not fit, so a film falls back to ac3
audio_format = "ac3"
# What is offered, and in what order.
#   enabled   the original is listed first, the decoded version beside it
#   forced    the decoded version leads, and for DTS it is the only one offered
#   disabled  nothing is decoded
mode = "enabled"
# Sessions allowed at once. Past this a further request is refused rather than
# queued. Set high on purpose: a television opens several connections within a
# second of pressing play, and a low ceiling refuses the one it meant to play on.
max_concurrent = 100

# Platform-specific notes:
# PLACEHOLDER_PLATFORM_NOTES
