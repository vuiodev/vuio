[package]
name = "oxicast"
version = "0.0.3"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Modified fork of oxicast for VuIO — async Google Cast client with ring TLS (no aws-lc)"
repository = "https://github.com/vuiodev/vuio"
readme = "README.md"
keywords = ["chromecast", "cast", "google-cast", "media", "tokio"]
categories = ["multimedia", "network-programming", "asynchronous"]
publish = false

[features]
default = ["discovery"]
discovery = ["dep:mdns-sd"]
serve = ["dep:axum"]
testing = []

[lib]
name = "oxicast"
path = "src/lib.rs"

[dependencies]
bytes = "1"
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tracing = "0.1"
mdns-sd = { version = "0.20", optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["tokio", "http1"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
