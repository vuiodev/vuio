# VuIO fork of upstream xaac-rs (Yehor Smoliakov), kept in `vendor/` so the AAC
# transcode path owns its fixes. Apache-2.0 like upstream.

[package]
edition = "2024"
rust-version = "1.85"
name = "vuio-xaac"
version = "0.3.0"
authors = ["vyrti", "Yehor Smoliakov <egorsmkv@gmail.com>"]
build = false
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "src/**",
    "tests/**",
    "examples/convert_wav_to_aac.rs",
    "examples/decode_stream.rs",
    "examples/file_info.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "High-level Rust xHE-AAC encoder/decoder bindings on libxaac. Fork of upstream xaac-rs maintained for VuIO's AAC transcode path."
repository = "https://github.com/vuiodev/vuio"
readme = "README.md"
keywords = [
    "aac",
    "xhe-aac",
    "usac",
    "audio",
    "encoder",
]
categories = [
    "multimedia::audio",
    "encoding",
    "api-bindings",
]
license = "Apache-2.0"

[features]
default = []
python = ["dep:pyo3"]

[lib]
name = "vuio_xaac"
crate-type = ["lib"]
path = "src/lib.rs"

[[example]]
name = "convert_wav_to_aac"
path = "examples/convert_wav_to_aac.rs"

[[example]]
name = "decode_stream"
path = "examples/decode_stream.rs"

[[example]]
name = "file_info"
path = "examples/file_info.rs"

[[test]]
name = "codec"
path = "tests/codec.rs"

[dependencies.vuio-xaac-sys]
version = "0.2.0"
path = "../vuio-xaac-sys"

[dependencies.pyo3]
version = "0.29"
features = ["extension-module"]
optional = true
