[package]
name = "oxideav-aac"
publish = false
version = "0.1.6"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-aac"
authors = ["Mark Karpeles"]
description = "Pure-Rust AAC-LC decoder and encoder for oxideav — ADTS framing, Huffman books 1-11, IMDCT, M/S stereo, TNS, PNS"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-aac"
keywords = ["multimedia", "audio", "aac", "codec", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::audio"]

[dependencies]
oxideav-core = { path = "../oxideav-core" }

# Vendored verbatim — see scripts/vendor-oxideav.sh. Upstream does not build
# under this repository's `-D warnings`, and making it would mean carrying a
# patch set across every refresh.
[lints.rust]
warnings = "allow"

[lints.clippy]
all = "allow"
