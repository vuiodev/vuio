[package]
name = "vuio-web"
version = "0.0.43"
edition = "2021"
rust-version = "1.95"
authors = ["vyrti"]
description = "The VuIO browser interface, compiled into the server binary"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vuiodev/vuio"
homepage = "https://github.com/vuiodev/vuio"
readme = "README.md"
keywords = ["dlna", "upnp", "media", "web"]
categories = ["multimedia", "web-programming"]
# The app's sources live in their own repository, github.com/vuiodev/vuio-web;
# only the built `dist/` is needed to compile. Source maps are not.
exclude = ["dist/**/*.map"]

[lib]
name = "vuio_web"
path = "src/lib.rs"

# Deliberately one dependency. This crate hands out bytes that were fixed at
# compile time: it holds no state, opens no socket and knows nothing about the
# server it is merged into, which is what lets the frontend be developed and
# released without touching anything in `vuio-core`.
[dependencies]
axum = { version = "0.8", default-features = false }
