# VuIO Server Configuration Example
# Copy this file to your platform's config directory and rename to config.toml
#
# Platform-specific config locations:
# - Native apps: ./config/config.toml
# - Docker: /config/config.toml (mounted volume)
#
# Every setting below can also be viewed and changed from the dashboard's Admin tab,
# which writes back to this file. A commented-out key is optional: leave it out and
# the default shown beside it applies. The keys that are not commented out are
# required, and the server will not start without them.

[server]
port = 8080
interface = "0.0.0.0"
name = "VuIO"
# Regenerate this for each server. A changed UUID makes clients treat it as new hardware.
uuid = "129c3ee9-4fd2-45ea-9f11-7a15e6d831ef"
# Address written into the media URLs handed to clients. Detected when omitted;
# usually only needed in Docker, where the container cannot see its host address.
# ip = "192.168.1.126"

[network]
interface_selection = "Auto"  # "Auto", "All", or a specific interface name
multicast_ttl = 4             # Currently not applied: the SSDP socket TTL is fixed at 4
announce_interval_seconds = 300
# mdns_enabled = true                     # Also advertise over Bonjour/DNS-SD
# upnp_callback_allowed_networks = []     # Extra CIDRs allowed as UPnP event callbacks
# Note: SSDP port is hardcoded to 1900 (DLNA standard) and cannot be changed

[media]
scan_on_startup = true
watch_for_changes = true
supported_extensions = [
    "mp4", "mkv", "avi", "mov", "wmv", "flv", "webm", "m4v", "mpg", "mpeg", "3gp", "ogv",
    "mp3", "flac", "wav", "aac", "ogg", "wma", "m4a", "opus", "ape",
    "jpg", "jpeg", "png", "gif", "bmp", "webp", "tiff", "svg", "heif", "heic", "avif"
]
# cleanup_deleted_files = true          # Drop files the startup scan finds gone
# autoplay_enabled = true               # Let renderers continue to the next item
# scan_playlists = true                 # Index .m3u and .pls files
# unavailable_root_grace_hours = 168    # How long an offline library keeps its content

# Add one or more media directories to monitor
[[media.directories]]
path = "/Users/alex/Movies"  # Change this to your actual media directory
recursive = true
# extensions = ["mp4", "mkv", "avi"]  # Optional: Override global extensions for this directory
# exclude_patterns = ["*.tmp", ".*"]  # Optional: Files/patterns to exclude
# case_sensitive = true               # Optional: omit to auto-detect per volume
# validation_mode = "Warn"            # "Warn", "Strict", or "Skip" when the path is missing

# Example: Additional media directory
# [[media.directories]]
# path = "/path/to/your/music"
# recursive = true
# extensions = ["mp3", "flac", "wav"]

[database]
vacuum_on_startup = false
backup_enabled = false
# Omit to use the platform-appropriate default location.
path = "./config/media.db"
# cache_mb = 128                        # Megabytes of index kept cached

[management]
# Requires a token for the dashboard and every management endpoint.
# --auth and VUIO_AUTH=1 turn this on too; any of the three is enough.
# enabled = false
# Omit to create/use admin.token beside the config file. VUIO_ADMIN_TOKEN overrides it.
# token_file = ""
# session_ttl_hours = 12
# Management is loopback-only unless CIDRs are explicitly listed.
# allowed_networks = []

[mediainfo]
# Fetch titles, synopses, ratings and artwork from public metadata services.
# This is the only part of VuIO that contacts anything outside the local
# network, and nothing is requested until you press Fetch in the dashboard.
# enabled = false
# Providers to consult. The five listed here need no account; tmdb, omdb,
# discogs, lastfm and genius work once you save a key in the dashboard.
# providers = ["tvmaze", "musicbrainz", "jikan", "anilist", "kitsu"]
# Download posters and cover art into a local cache so DLNA clients, which
# usually cannot reach the internet, can still display them.
# artwork_enabled = true
# Omit to keep the cache beside the database.
# artwork_path = "./config/artwork"
# Matches scoring below this are stored but flagged for review rather than
# trusted. 0-100.
# min_confidence = 60
# Whether a fetched title outranks the one read from the file's own tags.
# prefer_online_titles = true
# request_timeout_seconds = 15
