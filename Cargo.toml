[workspace]
members = [
    "crates/vuio-cast",
    "crates/vuio-core",
    "crates/vuio-cli",
    "crates/vuio-web",
    # Development tool, `publish = false`. Kept out of `vuio-cli` so the crate that
    # ships the binary does not carry its dependencies.
    "crates/vuio-bench",

    # The AC-3 / E-AC-3 / DTS decoders, vendored verbatim from github.com/OxideAV
    # by `scripts/vendor-oxideav.sh`. Members so cargo resolves the path deps and
    # `cargo test -p oxideav-ac3` works; deliberately not default members, so
    # their own test and bench targets stay off the release path — the same
    # reasoning that keeps `vuio-bench` out, and the reason a plain `cargo build`
    # still compiles them (vuio-core depends on them) without building their tests.
    "crates/vendor/oxideav-core",
    "crates/vendor/oxideav-ac3",
    "crates/vendor/oxideav-dts",
    "crates/vendor/oxideav-aac",
]

# `vuio-bench` is deliberately not a default member. Cargo unifies features across
# everything it builds in one go, so leaving it in would mean a plain
# `cargo build` — which is what the release pipeline runs — compiling `vuio-core`
# with `unstable-internals` on, for the benefit of a tool that never ships.
# Build it explicitly: `cargo run -p vuio-bench`.
default-members = [
    "crates/vuio-cast",
    "crates/vuio-core",
    "crates/vuio-cli",
    "crates/vuio-web",
]
resolver = "2"

# The vendored codecs are the only CPU-bound code in the tree, and an
# unoptimized AAC encoder turns a four-second test segment into a minute of
# wall clock. Optimizing those four packages alone leaves `cargo build` on the
# code actually being worked on as fast as it was.
[profile.dev.package.oxideav-core]
opt-level = 2
[profile.dev.package.oxideav-ac3]
opt-level = 2
[profile.dev.package.oxideav-dts]
opt-level = 2
[profile.dev.package.oxideav-aac]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 0
strip = true
overflow-checks = false
